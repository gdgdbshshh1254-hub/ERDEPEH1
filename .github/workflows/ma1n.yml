name: Windows RDP Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install Tailscale via Choco
      run: |
        choco install tailscale -y

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=github-rdp-runner

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create RDP User
      run: |
        net user rdpuser Pass@12345678 /add
        net localgroup administrators rdpuser /add

    - name: Show Tailscale IP
      run: |
        $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "=========================================="
        Write-Host "RDP IP Address : $ip"
        Write-Host "Username       : rdpuser"
        Write-Host "Password       : Pass@12345678"
        Write-Host "=========================================="

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 3600 }
        
